# Saturn Star — Cloudflare Worker Config
# Deploy with: npx wrangler deploy

name = "saturn-lead-intake"
main = "lead-intake.js"
compatibility_date = "2024-01-01"

# Custom route (once you add this worker to your Cloudflare account)
# routes = [
#   { pattern = "workers.starmovers.ca/lead-intake*", zone_name = "starmovers.ca" }
# ]

# ── Environment Variables ──
# Set these with: npx wrangler secret put SUPABASE_URL
# Then:           npx wrangler secret put SUPABASE_KEY
# DO NOT hardcode keys here — use wrangler secrets

[vars]
# Set PUBLIC_WORKER_BASE_URL to your deployed Worker base URL, for example:
# PUBLIC_WORKER_BASE_URL = "https://workers.starmovers.ca/lead-intake"
# Optionally set:
# WORKER_SHARED_SECRET = "match-the-next-app-worker_shared_secret"
# TWILIO_CALLER_ID = "+12267732993"
# PERSONAL_CELL = "+12267241730"

# ── Endpoints after deploy ──
# Twilio webhook:  https://saturn-lead-intake.YOUR-SUBDOMAIN.workers.dev/lead-intake/twilio
# Website form:    https://saturn-lead-intake.YOUR-SUBDOMAIN.workers.dev/lead-intake
# Zapier:          https://saturn-lead-intake.YOUR-SUBDOMAIN.workers.dev/lead-intake/zapier
